<!--
  ESSENCE · 纯白之息 — 极简香水品牌商品页
  设计主题：Apple 风 — 高级、克制、留白
  配色：米白 #FAF7F2 | 浅灰 #F0EDE8 | 玫瑰金 #C49A76
  动效档位：L1 精致静态 + 滚动揭示 + 购物车缩放动画
  作者：Claude | 日期：2026-05-31 | 迭代 v2
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>理工 · 文创小物商店</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,400&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ========================================
       一、CSS 变量 — 集中配色与质感
       ======================================== */
    :root {
      /* 核心色（零硬编码 hex，全部通过变量引用） */
      --cream:            #FAF7F2;
      --light-gray:       #F0EDE8;
      --warm-gray:        #E6E1D9;
      --rose-gold:        #C49A76;
      --rose-gold-deep:   #A87D5E;
      --rose-gold-light:  #E8C9A8;
      --rose-gold-rgb:    196, 154, 118;
      --text-primary:     #2C2416;
      --text-secondary:   #8C8278;
      --text-tertiary:    #B5ADA3;
      --white:            #FFFFFF;
      --success:          #7FB069;

      /* 阴影层级 */
      --shadow-xs:   0 1px 2px rgba(44, 36, 22, 0.04);
      --shadow-sm:   0 2px 8px rgba(44, 36, 22, 0.06);
      --shadow-md:   0 8px 24px rgba(44, 36, 22, 0.08);
      --shadow-lg:   0 16px 40px rgba(44, 36, 22, 0.10);
      --shadow-xl:   0 24px 56px rgba(44, 36, 22, 0.12);
      --shadow-card: 0 4px 20px rgba(44, 36, 22, 0.07);

      /* 玻璃拟态 */
      --glass-bg:       rgba(250, 247, 242, 0.72);
      --glass-border:   rgba(var(--rose-gold-rgb), 0.12);
      --glass-blur:     14px;

      /* 圆角 */
      --radius-xs:  8px;
      --radius-sm:  12px;
      --radius-md:  16px;
      --radius-lg:  24px;
      --radius-xl:  32px;

      /* 间距 */
      --space-xs:  4px;
      --space-sm:  8px;
      --space-md:  16px;
      --space-lg:  24px;
      --space-xl:  32px;
      --space-2xl: 48px;
      --space-3xl: 64px;

      /* 字体 */
      --font-sans:   'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif:  'Noto Serif SC', 'Songti SC', 'SimSun', serif;

      /* 过渡 */
      --ease-out-expo:  cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out-back:  cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-in-out:    cubic-bezier(0.65, 0, 0.35, 1);
      --duration-fast:  0.15s;
      --duration-base:  0.3s;
      --duration-slow:  0.5s;

      /* 布局 */
      --content-max:    1280px;
      --nav-height:     64px;
    }

    /* ========================================
       二、全局重置 & Reduced Motion
       ======================================== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 100px;
      padding-top: var(--nav-height);
    }

    /* === Reduced Motion 降级 === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ========================================
       三、顶部导航栏（全宽 sticky + 玻璃）
       ======================================== */
    .nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-xl);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-bottom: 1px solid var(--glass-border);
    }

    .nav-inner {
      max-width: var(--content-max);
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--text-primary);
      user-select: none;
    }

    .nav-brand span { color: var(--rose-gold); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
    }

    /* 搜索框 */
    .nav-search {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 8px 16px;
      border-radius: 100px;
      background: var(--light-gray);
      border: 1px solid transparent;
      transition: all var(--duration-base) var(--ease-out-expo);
      cursor: text;
    }

    .nav-search:hover { border-color: var(--warm-gray); }
    .nav-search:focus-within {
      border-color: rgba(var(--rose-gold-rgb), 0.35);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(var(--rose-gold-rgb), 0.08);
    }

    .nav-search input {
      border: none;
      background: none;
      outline: none;
      font-size: 0.8rem;
      font-family: var(--font-sans);
      color: var(--text-primary);
      width: 140px;
    }

    .nav-search input::placeholder { color: var(--text-tertiary); }
    .nav-search .search-icon { font-size: 0.9rem; opacity: 0.5; }

    /* 购物车图标 */
    .nav-cart {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: all var(--duration-base) var(--ease-out-expo);
    }

    .nav-cart:hover { background: var(--light-gray); }
    .nav-cart:active { transform: scale(0.92); }

    .nav-cart .badge {
      position: absolute;
      top: 4px;
      right: 2px;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      background: var(--rose-gold);
      color: var(--white);
      font-size: 0.675rem;
      font-weight: 600;
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      transition: transform 0.25s var(--ease-out-back);
    }

    .nav-cart .badge.bump { transform: scale(1.35); }

    .nav-cart .badge:empty,
    .nav-cart .badge[data-count="0"] {
      display: none;
    }

    /* ========================================
       四、Banner 横滑（修复 scroll-snap）
       ======================================== */
    .banner-section {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: var(--space-xl) var(--space-xl) var(--space-md);
    }

    /* 外层滚动容器 */
    .banner-scroll-wrapper {
      position: relative;
    }

    .banner-scroll {
      display: flex;
      gap: var(--space-md);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding: 0 calc((100% - 84%) / 2);  /* 让首尾卡片也能 snap 到居中 */
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }

    .banner-scroll::-webkit-scrollbar { display: none; }

    .banner-card {
      flex: 0 0 84%;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      height: 360px;
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--duration-base) var(--ease-out-expo);
      box-shadow: var(--shadow-md);
    }

    .banner-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .banner-card:active { transform: scale(0.98); }

    /* Banner 渐变背景 */
    .banner-bg {
      width: 100%;
      height: 100%;
    }

    .banner-bg-1 { background: linear-gradient(160deg, #e8ddd0 0%, #c8b8a5 40%, #b8a088 100%); }
    .banner-bg-2 { background: linear-gradient(160deg, #e2dce8 0%, #c4bdd0 40%, #a898b8 100%); }
    .banner-bg-3 { background: linear-gradient(160deg, #e6dfd5 0%, #d4c8b0 40%, #c4a98a 100%); }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(44, 36, 22, 0.02) 0%,
        rgba(44, 36, 22, 0.18) 50%,
        rgba(44, 36, 22, 0.42) 100%
      );
    }

    .banner-text {
      position: absolute;
      bottom: var(--space-xl);
      left: var(--space-xl);
      right: var(--space-xl);
      color: var(--white);
    }

    .banner-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--rose-gold-light);
      margin-bottom: var(--space-sm);
      padding: 4px 12px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .banner-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: var(--space-xs);
    }

    .banner-sub {
      font-size: 0.9rem;
      font-weight: 300;
      opacity: 0.85;
      line-height: 1.5;
    }

    /* 点状指示器 */
    .banner-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: var(--space-lg);
    }

    .banner-dot {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: var(--text-tertiary);
      border: none;
      cursor: pointer;
      transition: all var(--duration-base) var(--ease-out-expo);
      padding: 0;
    }

    .banner-dot.active {
      width: 28px;
      background: var(--rose-gold);
    }

    /* 左右箭头 */
    .banner-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: all var(--duration-base) var(--ease-out-expo);
      box-shadow: var(--shadow-sm);
    }

    .banner-arrow:hover {
      background: var(--white);
      box-shadow: var(--shadow-md);
      transform: translateY(-50%) scale(1.06);
    }

    .banner-arrow:active { transform: translateY(-50%) scale(0.94); }
    .banner-arrow.prev { left: -12px; }
    .banner-arrow.next { right: -12px; }

    @media (max-width: 768px) {
      .banner-arrow { display: none; }
    }

    /* ========================================
       五、分类标签
       ======================================== */
    .category-section {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: var(--space-md) var(--space-xl);
    }

    .category-row {
      display: flex;
      gap: var(--space-sm);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-row::-webkit-scrollbar { display: none; }

    .category-chip {
      flex-shrink: 0;
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--light-gray);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all var(--duration-base) var(--ease-out-expo);
      white-space: nowrap;
      user-select: none;
    }

    .category-chip:hover {
      color: var(--text-primary);
      background: var(--warm-gray);
    }

    .category-chip.active {
      color: var(--rose-gold-deep);
      background: rgba(var(--rose-gold-rgb), 0.10);
      border-color: rgba(var(--rose-gold-rgb), 0.28);
      font-weight: 600;
    }

    /* ========================================
       六、商品卡片网格（响应式 + 玻璃拟态）
       ======================================== */
    .products-section {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: var(--space-lg) var(--space-xl) var(--space-3xl);
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: var(--space-lg);
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .section-count {
      font-size: 0.8rem;
      color: var(--text-tertiary);
      font-weight: 400;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-lg);
    }

    /* 卡片 — 玻璃拟态 + 细腻阴影 */
    .product-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: all var(--duration-base) var(--ease-out-expo);
      box-shadow: var(--shadow-card);
      /* 滚动揭示初始态 */
      opacity: 0;
      transform: translateY(24px);
    }

    .product-card.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(var(--rose-gold-rgb), 0.22);
    }

    /* 图片区域 */
    .product-card .card-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    /* 真实图片 */
    .product-card .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s var(--ease-out-expo);
    }

    .product-card .card-img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      transition: transform 0.6s var(--ease-out-expo);
    }

    .product-card:hover .card-img-placeholder {
      transform: scale(1.08);
    }

    .card-img-placeholder .bottle-icon {
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.10));
    }

    .card-img-1 { background: linear-gradient(160deg, #f5efe6 0%, #e8d5c0 100%); }
    .card-img-2 { background: linear-gradient(160deg, #f0edf4 0%, #d8d0e8 100%); }
    .card-img-3 { background: linear-gradient(160deg, #f2f0ea 0%, #ddd5c4 100%); }
    .card-img-4 { background: linear-gradient(160deg, #f5f0ec 0%, #e0d4cc 100%); }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--white);
      background: var(--rose-gold);
      pointer-events: none;
    }

    /* 信息区 */
    .card-info {
      padding: var(--space-md);
    }

    .card-brand {
      font-size: 0.65rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--rose-gold);
      margin-bottom: 4px;
    }

    .card-name {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 2px;
      line-height: 1.3;
    }

    .card-note {
      font-size: 0.7rem;
      color: var(--text-tertiary);
      margin-bottom: var(--space-sm);
      line-height: 1.5;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .card-price {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .card-price .currency {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* ========================================
       七、数量选择器（+/- 增减控件）
       ======================================== */
    .qty-control {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: var(--light-gray);
      border-radius: 100px;
      padding: 3px;
    }

    .qty-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: var(--white);
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s var(--ease-out-expo);
      box-shadow: var(--shadow-xs);
      line-height: 1;
    }

    .qty-btn:hover {
      background: var(--rose-gold);
      color: var(--white);
      box-shadow: 0 2px 8px rgba(var(--rose-gold-rgb), 0.35);
    }

    .qty-btn:active {
      transform: scale(0.85);
      transition: all 0.08s ease;
    }

    .qty-btn.dec {
      font-size: 1.2rem;
      line-height: 0.8;
    }

    .qty-value {
      min-width: 28px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      user-select: none;
    }

    /* 加入购物车按钮（初始态：只显示 +） */
    .btn-cart-add {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--rose-gold);
      color: var(--white);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s var(--ease-out-back);
      box-shadow: 0 3px 12px rgba(var(--rose-gold-rgb), 0.32);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      line-height: 1;
    }

    .btn-cart-add:hover {
      background: var(--rose-gold-deep);
      box-shadow: 0 6px 20px rgba(var(--rose-gold-rgb), 0.45);
      transform: scale(1.1);
    }

    .btn-cart-add:active {
      transform: scale(0.82);
      transition: all 0.08s ease;
    }

    /* 涟漪 */
    .btn-cart-add.ripple::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid var(--rose-gold);
      animation: ripple-out 0.55s ease-out forwards;
    }

    @keyframes ripple-out {
      0%   { transform: scale(0.7); opacity: 1; }
      100% { transform: scale(2.0); opacity: 0; }
    }

    /* 成功状态 */
    .btn-cart-add.success-flash {
      background: var(--success);
      box-shadow: 0 3px 12px rgba(127, 176, 105, 0.4);
      pointer-events: none;
    }

    /* ========================================
       八、底部结算栏（全宽固定）
       ======================================== */
    .checkout-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-top: 1px solid var(--glass-border);
      padding: var(--space-md) var(--space-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .checkout-inner {
      max-width: var(--content-max);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .checkout-info {
      display: flex;
      flex-direction: column;
    }

    .checkout-count {
      font-size: 0.725rem;
      color: var(--text-tertiary);
      margin-bottom: 2px;
    }

    .checkout-total {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .checkout-total .currency {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .btn-checkout {
      padding: 14px 40px;
      border-radius: 100px;
      border: none;
      background: var(--text-primary);
      color: var(--white);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: var(--font-sans);
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all var(--duration-base) var(--ease-out-expo);
      white-space: nowrap;
      min-width: 120px;
    }

    .btn-checkout:hover:not(:disabled) {
      background: #3D3428;
      transform: scale(1.04);
    }

    .btn-checkout:active:not(:disabled) {
      transform: scale(0.95);
    }

    .btn-checkout:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ========================================
       九、Toast 提示
       ======================================== */
    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: var(--text-primary);
      color: var(--white);
      padding: 14px 28px;
      border-radius: 100px;
      font-size: 0.825rem;
      font-weight: 500;
      font-family: var(--font-sans);
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: all 0.4s var(--ease-out-expo);
      box-shadow: var(--shadow-xl);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ========================================
       十、购物车抽屉（点击右上角购物车弹出）
       ======================================== */
    .cart-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(44, 36, 22, 0.25);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--duration-base) var(--ease-out-expo);
    }

    .cart-drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 400px;
      max-width: 90vw;
      background: var(--white);
      z-index: 301;
      box-shadow: var(--shadow-xl);
      transform: translateX(100%);
      transition: transform 0.4s var(--ease-in-out);
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open { transform: translateX(0); }

    .cart-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-lg) var(--space-xl);
      border-bottom: 1px solid var(--warm-gray);
    }

    .cart-drawer-header h3 {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 500;
    }

    .cart-drawer-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--light-gray);
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--duration-fast) var(--ease-out-expo);
    }

    .cart-drawer-close:hover { background: var(--warm-gray); }

    .cart-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-lg);
    }

    .cart-empty {
      text-align: center;
      padding: var(--space-3xl) var(--space-lg);
      color: var(--text-tertiary);
      font-size: 0.9rem;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md) 0;
      border-bottom: 1px solid var(--warm-gray);
    }

    .cart-item-img {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    .cart-item-info { flex: 1; min-width: 0; }

    .cart-item-name {
      font-family: var(--font-serif);
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .cart-item-note {
      font-size: 0.7rem;
      color: var(--text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-price {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .cart-drawer-footer {
      padding: var(--space-lg) var(--space-xl);
      border-top: 1px solid var(--warm-gray);
    }

    /* ========================================
       十一、响应式
       ======================================== */
    /* 平板 */
    @media (max-width: 1024px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-md);
      }
      .banner-card { height: 280px; }
      .banner-title { font-size: 1.5rem; }
    }

    /* ===== 手机端全面适配 ===== */
    @media (max-width: 640px) {
      :root {
        --space-xl: 12px;
        --space-lg: 12px;
        --space-md: 10px;
        --nav-height: 56px;
      }

      body {
        padding-top: var(--nav-height);
        padding-bottom: 90px;
      }

      /* 导航栏 */
      .nav-bar { padding: 0 var(--space-md); }
      .nav-brand { font-size: 1.1rem; }
      .nav-search { display: none; }
      .nav-cart { width: 40px; height: 40px; }

      /* Banner */
      .banner-section { padding: var(--space-md) 0 var(--space-sm); }
      .banner-scroll { padding: 0 var(--space-md); gap: var(--space-sm); }
      .banner-card { flex: 0 0 88%; height: 180px; }
      .banner-arrow { display: none; }
      .banner-text { bottom: var(--space-md); left: var(--space-md); right: var(--space-md); }
      .banner-tag { font-size: 0.6rem; padding: 3px 10px; margin-bottom: 6px; }
      .banner-title { font-size: 1.15rem; }
      .banner-sub { font-size: 0.7rem; }
      .banner-dots { margin-top: var(--space-sm); gap: 6px; }

      /* 分类 */
      .category-section { padding: var(--space-sm) var(--space-md); }
      .category-chip { padding: 7px 14px; font-size: 0.75rem; }

      /* 商品网格 */
      .products-section { padding: var(--space-sm) var(--space-md) 40px; }
      .section-header { margin-bottom: var(--space-sm); }
      .section-title { font-size: 1.05rem; }
      .products-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .card-info { padding: 10px; }
      .card-brand { font-size: 0.6rem; }
      .card-name { font-size: 0.8rem; }
      .card-note { font-size: 0.65rem; margin-bottom: 6px; }
      .card-price { font-size: 0.9rem; }
      .btn-cart-add { width: 34px; height: 34px; font-size: 1.1rem; }
      .qty-control { padding: 2px; }
      .qty-btn { width: 26px; height: 26px; }
      .qty-value { font-size: 0.75rem; min-width: 20px; }

      /* 结算栏 */
      .checkout-bar { padding: 10px var(--space-md); }
      .checkout-total { font-size: 1.1rem; }
      .btn-checkout { padding: 12px 28px; font-size: 0.8rem; min-width: 90px; }

      /* Toast */
      .toast { top: 70px; font-size: 0.75rem; padding: 10px 20px; }

      /* 购物车抽屉 — 全宽 */
      .cart-drawer { width: 100%; max-width: 100vw; }



      /* 触摸目标 ≥ 44×44px */
      .category-chip, .btn-cart-add, .qty-btn, .btn-checkout,
        min-height: 44px; min-width: 44px;
      }
    }
  </style>
</head>
<body>

  <!-- ======== 导航栏 ======== -->
  <nav class="nav-bar">
    <div class="nav-inner">
      <div class="nav-brand">理<span>工</span></div>
      <div class="nav-actions">
        <label class="nav-search">
          <span class="search-icon">&#x1F50D;</span>
          <input type="search" placeholder="搜索文创…" aria-label="搜索文创">
        </label>
        <button class="nav-cart" id="navCartBtn" aria-label="购物车">
          &#x1F6CD;
          <span class="badge" id="cartBadge" data-count="0"></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ======== Banner 横滑（JS 动态渲染） ======== -->
  <section class="banner-section" aria-label="精选 Banner">
    <div class="banner-scroll-wrapper">
      <button class="banner-arrow prev" id="bannerPrev" aria-label="上一张">&#x2039;</button>
      <button class="banner-arrow next" id="bannerNext" aria-label="下一张">&#x203A;</button>
      <div class="banner-scroll" id="bannerScroll">
        <!-- JS 动态渲染 -->
      </div>
    </div>
    <div class="banner-dots" id="bannerDots">
      <!-- JS 动态渲染 -->
    </div>
  </section>

  <!-- ======== 分类标签（JS 动态渲染） ======== -->
  <div class="category-section">
    <div class="category-row" id="categoryRow">
      <!-- JS 动态渲染 -->
    </div>
  </div>

  <!-- ======== 商品列表 ======== -->
  <section class="products-section" aria-label="商品列表">
    <div class="section-header">
      <h2 class="section-title">全部文创</h2>
      <span class="section-count" id="productCount">共 6 件</span>
    </div>
    <div class="products-grid" id="productsGrid">
      <!-- JS 动态渲染 -->
    </div>
  </section>

  <!-- ======== 底部结算栏 ======== -->
  <div class="checkout-bar" id="checkoutBar">
    <div class="checkout-inner">
      <div class="checkout-info">
        <span class="checkout-count" id="checkoutCount">暂未选择商品</span>
        <span class="checkout-total">
          <span class="currency">¥</span><span id="checkoutTotal">0</span>
        </span>
      </div>
      <button class="btn-checkout" id="btnCheckout" disabled>结算</button>
    </div>
  </div>

  <!-- ======== Toast ======== -->
  <div class="toast" id="toast"></div>

  
  <!-- ======== 购物车抽屉 ======== -->
  <div class="cart-drawer-overlay" id="cartOverlay"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-drawer-header">
      <h3>购物车</h3>
      <button class="cart-drawer-close" id="cartDrawerClose" aria-label="关闭">✕</button>
    </div>
    <div class="cart-drawer-body" id="cartDrawerBody">
      <div class="cart-empty">购物车是空的</div>
    </div>
    <div class="cart-drawer-footer">
      <button class="btn-checkout" id="cartDrawerCheckout" style="width:100%;" disabled>去结算</button>
    </div>
  </div>

  

<script>
    /* ========================================
       数据层 — 商品列表
       ======================================== */
    // 分类数据（key 用于数据关联，label 用于显示）
    // Banner 数据（可编辑）
    const banners = [
      { tag: 'New Arrival', title: '四季书签·春',     sub: '铜镀玫瑰金 · 樱花镂空 · 流苏书签', bg: 'banner-bg-1' },
      { tag: 'Best Seller', title: '故宫雪景冰箱贴',   sub: '太和殿雪景 · 亚克力浮雕 · 磁吸',   bg: 'banner-bg-2' },
      { tag: 'Hot Pick',    title: '马卡龙色系笔记本', sub: 'A5/B6双尺寸 · 道林纸 · 软硬壳可选', bg: 'banner-bg-3' }
    ];

    const categories = [
      { key: 'bookmark',  label: '四季书签' },
      { key: 'magnet',    label: '冰箱贴' },
      { key: 'notebook',  label: '马卡龙色系笔记本' }
    ];

    const products = [
      { id: 1, brand: '理工', name: '春樱书签',   note: '樱花浮雕 · 铜镀玫瑰金 · 流苏坠',   price: 38,  category: 'bookmark',  badge: '新品',     gradient: 'card-img-1', emoji: '🌸', image: '' },
      { id: 2, brand: '理工', name: '夏荷书签',   note: '荷叶镂空 · 黄铜做旧 · 绿松石缀',   price: 42,  category: 'bookmark',  badge: '',         gradient: 'card-img-2', emoji: '🍃', image: '' },
      { id: 3, brand: '理工', name: '故宫雪景',   note: '太和殿雪景 · 亚克力浮雕 · 磁吸',   price: 28,  category: 'magnet',    badge: '热卖',     gradient: 'card-img-3', emoji: '🏯', image: '' },
      { id: 4, brand: '理工', name: '猫咪系列',   note: '六只姿态各异的猫 · 软磁 · 礼盒装', price: 55,  category: 'magnet',    badge: '',         gradient: 'card-img-4', emoji: '🐱', image: '' },
      { id: 5, brand: '理工', name: '马卡龙·樱花粉', note: 'A5软面 · 80g道林纸 · 192页',     price: 68,  category: 'notebook',  badge: '爆款',     gradient: 'card-img-1', emoji: '📒', image: '' },
      { id: 6, brand: '理工', name: '马卡龙·薄荷绿', note: 'B6硬壳 · 100g象牙纸 · 256页',    price: 79,  category: 'notebook',  badge: '',         gradient: 'card-img-2', emoji: '📘', image: '' }
    ];

    /* ========================================
       状态层
       ======================================== */
    let cart = [];              // { id, qty }
    let activeCategory = 'all';

    /* ========================================
       DOM 引用
       ======================================== */
    const $productsGrid   = document.getElementById('productsGrid');
    const $productCount   = document.getElementById('productCount');
    const $checkoutCount  = document.getElementById('checkoutCount');
    const $checkoutTotal  = document.getElementById('checkoutTotal');
    const $btnCheckout    = document.getElementById('btnCheckout');
    const $cartBadge      = document.getElementById('cartBadge');
    const $bannerScroll        = document.getElementById('bannerScroll');
    const $bannerDotsContainer = document.getElementById('bannerDots');
    const $bannerPrev          = document.getElementById('bannerPrev');
    const $bannerNext          = document.getElementById('bannerNext');
    const $toast          = document.getElementById('toast');
    const $categoryRow    = document.getElementById('categoryRow');
    const $navCartBtn     = document.getElementById('navCartBtn');
    const $cartOverlay    = document.getElementById('cartOverlay');
    const $cartDrawer     = document.getElementById('cartDrawer');
    const $cartDrawerBody = document.getElementById('cartDrawerBody');
    const $cartDrawerClose = document.getElementById('cartDrawerClose');
    const $cartDrawerCheckout = document.getElementById('cartDrawerCheckout');

    /* ========================================
       工具函数
       ======================================== */
    function getCartItem(id)   { return cart.find(c => c.id === id); }
    function getProduct(id)    { return products.find(p => p.id === id); }
    function totalItems()      { return cart.reduce((s, i) => s + i.qty, 0); }
    function totalPrice()      { return cart.reduce((s, i) => { const p = getProduct(i.id); return s + (p ? p.price * i.qty : 0); }, 0); }

    /* ========================================
       渲染层 — 商品卡片
       ======================================== */
    function renderProducts(filter = 'all') {
      const filtered = filter === 'all'
        ? products
        : products.filter(p => p.category === filter);

      $productCount.textContent = `共 ${filtered.length} 件`;

      $productsGrid.innerHTML = filtered.map(p => {
        const cartItem = getCartItem(p.id);
        const qty = cartItem ? cartItem.qty : 0;

        // 右侧控件：未加入显示 + 按钮，已加入显示数量调节器
        let actionHTML;
        if (qty > 0) {
          actionHTML = `
            <div class="qty-control">
              <button class="qty-btn dec" data-id="${p.id}" aria-label="减少数量">−</button>
              <span class="qty-value">${qty}</span>
              <button class="qty-btn inc" data-id="${p.id}" aria-label="增加数量">+</button>
            </div>`;
        } else {
          actionHTML = `<button class="btn-cart-add" data-id="${p.id}" aria-label="加入购物车">+</button>`;
        }

        // 图片区域：有真实图片用 <img>，否则用渐变+emoji 占位
        const imgHTML = p.image
          ? `<img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
          : '';
        const placeholderHTML = p.image
          ? `<div class="card-img-placeholder" style="display:none;"><span class="bottle-icon">${p.emoji}</span></div>`
          : `<div class="card-img-placeholder"><span class="bottle-icon">${p.emoji}</span></div>`;

        return `
          <div class="product-card" data-id="${p.id}">
            <div class="card-img ${p.gradient}">
              ${imgHTML}
              ${placeholderHTML}
              ${p.badge ? `<span class="card-badge">${p.badge}</span>` : ''}
            </div>
            <div class="card-info">
              <div class="card-brand">${p.brand}</div>
              <div class="card-name">${p.name}</div>
              <div class="card-note">${p.note}</div>
              <div class="card-bottom">
                <span class="card-price">
                  <span class="currency">¥</span>${p.price}
                </span>
                ${actionHTML}
              </div>
            </div>
          </div>`;
      }).join('');

      // 绑定事件
      bindCartEvents();
      // 滚动揭示
      initReveal();
    }

    /* ========================================
       事件绑定 — 购物车按钮
       ======================================== */
    function bindCartEvents() {
      // "加入购物车"按钮（初始 +）
      document.querySelectorAll('.btn-cart-add').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          addToCart(id, btn);
        });
      });

      // 增加按钮（qty-control 内的 +）
      document.querySelectorAll('.qty-btn.inc').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          incrementCart(id);
        });
      });

      // 减少按钮（qty-control 内的 −）
      document.querySelectorAll('.qty-btn.dec').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          decrementCart(id);
        });
      });
    }

    /* ========================================
       购物车操作
       ======================================== */
    function addToCart(id, btnElement) {
      const existing = getCartItem(id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id, qty: 1 });
      }

      // 按钮动画
      if (btnElement) {
        btnElement.classList.add('ripple');
        btnElement.classList.add('success-flash');
        btnElement.textContent = '✓';
        setTimeout(() => {
          btnElement.classList.remove('ripple');
          btnElement.classList.remove('success-flash');
        }, 600);
      }

      // 重新渲染（显示数量选择器）
      renderProducts(activeCategory);
      updateCheckoutBar();
      updateCartBadge();
      const product = getProduct(id);
      showToast(`已添加「${product.name}」`);
    }

    function incrementCart(id) {
      const item = getCartItem(id);
      if (!item) return;
      item.qty += 1;
      renderProducts(activeCategory);
      updateCheckoutBar();
      updateCartBadge();
    }

    function decrementCart(id) {
      const item = getCartItem(id);
      if (!item) return;
      item.qty -= 1;
      if (item.qty <= 0) {
        cart = cart.filter(c => c.id !== id);
        const product = getProduct(id);
        showToast(`已移除「${product.name}」`);
      }
      renderProducts(activeCategory);
      updateCheckoutBar();
      updateCartBadge();
    }

    /* ========================================
       结算栏更新
       ======================================== */
    function updateCheckoutBar() {
      const count = totalItems();
      const price = totalPrice();

      if (count === 0) {
        $checkoutCount.textContent = '暂未选择商品';
        $checkoutTotal.textContent = '0';
        $btnCheckout.disabled = true;
      } else {
        $checkoutCount.textContent = `共 ${count} 件商品`;
        $checkoutTotal.textContent = price.toLocaleString();
        $btnCheckout.disabled = false;
      }
    }

    function updateCartBadge() {
      const count = totalItems();
      $cartBadge.textContent = count;
      $cartBadge.setAttribute('data-count', count);
      // 徽标弹跳动画
      $cartBadge.classList.add('bump');
      setTimeout(() => $cartBadge.classList.remove('bump'), 300);
    }

    /* ========================================
       Toast
       ======================================== */
    let toastTimer;
    function showToast(msg) {
      clearTimeout(toastTimer);
      $toast.textContent = msg;
      $toast.classList.add('show');
      toastTimer = setTimeout(() => $toast.classList.remove('show'), 1800);
    }

    /* ========================================
       购物车抽屉
       ======================================== */
    function openCartDrawer() {
      renderCartDrawer();
      $cartOverlay.classList.add('open');
      $cartDrawer.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeCartDrawer() {
      $cartOverlay.classList.remove('open');
      $cartDrawer.classList.remove('open');
      document.body.style.overflow = '';
    }

    function renderCartDrawer() {
      if (cart.length === 0) {
        $cartDrawerBody.innerHTML = '<div class="cart-empty">购物车是空的</div>';
        $cartDrawerCheckout.disabled = true;
        return;
      }

      $cartDrawerBody.innerHTML = cart.map(item => {
        const p = getProduct(item.id);
        if (!p) return '';
        return `
          <div class="cart-item">
            <div class="cart-item-img ${p.gradient}" style="display:flex;align-items:center;justify-content:center;font-size:1.5rem;">${p.emoji}</div>
            <div class="cart-item-info">
              <div class="cart-item-name">${p.name}</div>
              <div class="cart-item-note">${p.note}</div>
              <div class="qty-control" style="margin-top:6px;">
                <button class="qty-btn dec drawer-dec" data-id="${item.id}" aria-label="减少">−</button>
                <span class="qty-value">${item.qty}</span>
                <button class="qty-btn inc drawer-inc" data-id="${item.id}" aria-label="增加">+</button>
              </div>
            </div>
            <div class="cart-item-price">¥${(p.price * item.qty).toLocaleString()}</div>
          </div>`;
      }).join('');

      $cartDrawerCheckout.disabled = false;

      // 抽屉内的 +/- 事件
      document.querySelectorAll('.drawer-inc').forEach(btn => {
        btn.addEventListener('click', () => {
          incrementCart(parseInt(btn.dataset.id));
          renderCartDrawer();
          updateCheckoutBar();
          updateCartBadge();
        });
      });
      document.querySelectorAll('.drawer-dec').forEach(btn => {
        btn.addEventListener('click', () => {
          decrementCart(parseInt(btn.dataset.id));
          renderCartDrawer();
          renderProducts(activeCategory);
          updateCheckoutBar();
          updateCartBadge();
        });
      });
    }

    $navCartBtn.addEventListener('click', openCartDrawer);
    $cartOverlay.addEventListener('click', closeCartDrawer);
    $cartDrawerClose.addEventListener('click', closeCartDrawer);

    $btnCheckout.addEventListener('click', () => {
      if (cart.length === 0) return;
      openCartDrawer();
    });

    $cartDrawerCheckout.addEventListener('click', () => {
      if (cart.length === 0) return;
      showToast(`感谢选购！共 ${totalItems()} 件商品，即将跳转结算…`);
      $cartDrawerCheckout.style.transform = 'scale(0.94)';
      setTimeout(() => { $cartDrawerCheckout.style.transform = ''; }, 150);
    });

    /* ========================================
       分类筛选
       ======================================== */
    $categoryRow.addEventListener('click', (e) => {
      const chip = e.target.closest('.category-chip');
      if (!chip) return;
      document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCategory = chip.dataset.cat;
      renderProducts(activeCategory);
    });

    /* ========================================
       Banner 横滑（修复版）
       ======================================== */
    function getBannerCardWidth() {
      const card = $bannerScroll.querySelector('.banner-card');
      if (!card) return 0;
      const cardW = card.offsetWidth;
      const gap = parseInt(getComputedStyle($bannerScroll).gap) || 16;
      return cardW + gap;
    }

    function getBannerIndex() {
      const step = getBannerCardWidth();
      if (step === 0) return 0;
      return Math.round($bannerScroll.scrollLeft / step);
    }

    function getBannerDots() { return document.querySelectorAll('#bannerDots .banner-dot'); }

    function updateBannerDots() {
      const idx = getBannerIndex();
      getBannerDots().forEach((dot, i) => dot.classList.toggle('active', i === idx));
    }

    function scrollToBanner(index) {
      const step = getBannerCardWidth();
      $bannerScroll.scrollTo({ left: step * index, behavior: 'smooth' });
    }

    // 滚动监听
    $bannerScroll.addEventListener('scroll', updateBannerDots, { passive: true });

    // 指示器点击
    $bannerDotsContainer.addEventListener('click', (e) => {
      const dot = e.target.closest('.banner-dot');
      if (!dot) return;
      scrollToBanner(parseInt(dot.dataset.index));
    });

    // 左右箭头
    $bannerPrev.addEventListener('click', () => {
      const idx = getBannerIndex();
      scrollToBanner(Math.max(0, idx - 1));
    });

    $bannerNext.addEventListener('click', () => {
      const idx = getBannerIndex();
      const dots = getBannerDots();
      scrollToBanner(Math.min(dots.length - 1, idx + 1));
    });

    let resizeDebounce;
    window.addEventListener('resize', () => {
      clearTimeout(resizeDebounce);
      resizeDebounce = setTimeout(updateBannerDots, 100);
    });

    // 键盘左右键支持
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft')  { e.preventDefault(); const idx = getBannerIndex(); scrollToBanner(Math.max(0, idx - 1)); }
      if (e.key === 'ArrowRight') { e.preventDefault(); const idx = getBannerIndex(); const dots = getBannerDots(); scrollToBanner(Math.min(dots.length - 1, idx + 1)); }
    });

    // Escape 关闭抽屉
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && $cartDrawer.classList.contains('open')) {
        closeCartDrawer();
      }
    });

    /* ========================================
       滚动揭示（IntersectionObserver）
       ======================================== */
    function initReveal() {
      const cards = document.querySelectorAll('.product-card:not(.revealed)');
      if (cards.length === 0) return;

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
          if (entry.isIntersecting) {
            // 逐张卡片延时出现
            const delay = Array.from(cards).indexOf(entry.target) % 6;
            setTimeout(() => {
              entry.target.classList.add('revealed');
            }, delay * 60);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });

      cards.forEach(card => observer.observe(card));
    }

	    /* ========================================
	       初始化
	       ======================================== */
	    function init() {
	      renderBanners();
	      renderCategories();
	      renderProducts();
	      updateCheckoutBar();
	    }

    
	    console.log('%c 理工 · 文创小物商店 %c v3 ',
	      'font-family:serif;font-size:20px;color:#C49A76;',
	      'font-size:10px;color:#8C8278;');
	    console.log('🛒 购物车操作：点击 + 添加 | 点击 −/+ 增减 | 点击右上角购物车图标查看详情');
	    console.log('🎠 Banner：左右箭头 / 键盘方向键 / 点击圆点均可切换');

	    /* ========================================
	       Banner 渲染
	       ======================================== */
	    function renderBanners() {
	      $bannerScroll.innerHTML = banners.map(b => `
	        <div class="banner-card">
	          <div class="banner-bg ${b.bg}"></div>
	          <div class="banner-overlay"></div>
	          <div class="banner-text">
	            <div class="banner-tag">${b.tag}</div>
	            <div class="banner-title">${b.title}</div>
	            <div class="banner-sub">${b.sub}</div>
	          </div>
	        </div>
	      `).join('');

	      $bannerDotsContainer.innerHTML = banners.map((_, i) => `
	        <button class="banner-dot ${i === 0 ? 'active' : ''}" data-index="${i}" aria-label="第${i+1}张"></button>
	      `).join('');

	      window._bannerDots = document.querySelectorAll('.banner-dot');
	    }

	    /* ========================================
	       分类标签渲染
	       ======================================== */
	    function renderCategories() {
	      const currentActive = $categoryRow.querySelector('.category-chip.active');
	      const activeKey = currentActive ? currentActive.dataset.cat : 'all';

	      $categoryRow.innerHTML = `<div class="category-chip ${activeKey === 'all' ? 'active' : ''}" data-cat="all">全部</div>` +
	        categories.map(c => `
	          <div class="category-chip ${activeKey === c.key ? 'active' : ''}" data-cat="${c.key}">${c.label}</div>
	        `).join('');
	    }


	    init();
	  </script>

	</body>
