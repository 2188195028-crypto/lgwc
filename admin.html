<!--
  理工文创小物商店 · 管理后台
  设计主题：Apple 风 — 高级、克制、留白
  配色：米白 #FAF7F2 | 浅灰 #F0EDE8 | 玫瑰金 #C49A76
  功能：商品管理 / 分类管理 / Banner管理 / 导入导出 / 密码保护
  作者：Claude | 日期：2026-06-23 | 迭代 v3-admin
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>理工文创 · 管理后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,400&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ========================================
       一、CSS 变量 — 集中配色与质感
       ======================================== */
    :root {
      /* 核心色（零硬编码 hex，全部通过变量引用） */
      --cream:            #FAF7F2;
      --light-gray:       #F0EDE8;
      --warm-gray:        #E6E1D9;
      --rose-gold:        #C49A76;
      --rose-gold-deep:   #A87D5E;
      --rose-gold-light:  #E8C9A8;
      --rose-gold-rgb:    196, 154, 118;
      --text-primary:     #2C2416;
      --text-secondary:   #8C8278;
      --text-tertiary:    #B5ADA3;
      --white:            #FFFFFF;
      --success:          #7FB069;

      /* 阴影层级 */
      --shadow-xs:   0 1px 2px rgba(44, 36, 22, 0.04);
      --shadow-sm:   0 2px 8px rgba(44, 36, 22, 0.06);
      --shadow-md:   0 8px 24px rgba(44, 36, 22, 0.08);
      --shadow-lg:   0 16px 40px rgba(44, 36, 22, 0.10);
      --shadow-xl:   0 24px 56px rgba(44, 36, 22, 0.12);
      --shadow-card: 0 4px 20px rgba(44, 36, 22, 0.07);

      /* 玻璃拟态 */
      --glass-bg:       rgba(250, 247, 242, 0.72);
      --glass-border:   rgba(var(--rose-gold-rgb), 0.12);
      --glass-blur:     14px;

      /* 圆角 */
      --radius-xs:  8px;
      --radius-sm:  12px;
      --radius-md:  16px;
      --radius-lg:  24px;
      --radius-xl:  32px;

      /* 间距 */
      --space-xs:  4px;
      --space-sm:  8px;
      --space-md:  16px;
      --space-lg:  24px;
      --space-xl:  32px;
      --space-2xl: 48px;
      --space-3xl: 64px;

      /* 字体 */
      --font-sans:   'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif:  'Noto Serif SC', 'Songti SC', 'SimSun', serif;

      /* 过渡 */
      --ease-out-expo:  cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out-back:  cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-in-out:    cubic-bezier(0.65, 0, 0.35, 1);
      --duration-fast:  0.15s;
      --duration-base:  0.3s;
      --duration-slow:  0.5s;

      /* 布局 */
      --content-max:    1280px;
      --nav-height:     64px;
    }

    /* ========================================
       二、全局重置 & Reduced Motion
       ======================================== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background: var(--cream);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 100px;
      padding-top: var(--nav-height);
    }

    /* === Reduced Motion 降级 === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ========================================
       三、顶部导航栏（全宽 sticky + 玻璃）
       ======================================== */
    .nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-xl);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-bottom: 1px solid var(--glass-border);
    }

    .nav-inner {
      max-width: var(--content-max);
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--text-primary);
      user-select: none;
    }

    .nav-brand span { color: var(--rose-gold); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
    }

    /* 搜索框 */
    .nav-search {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 8px 16px;
      border-radius: 100px;
      background: var(--light-gray);
      border: 1px solid transparent;
      transition: all var(--duration-base) var(--ease-out-expo);
      cursor: text;
    }

    .nav-search:hover { border-color: var(--warm-gray); }
    .nav-search:focus-within {
      border-color: rgba(var(--rose-gold-rgb), 0.35);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(var(--rose-gold-rgb), 0.08);
    }

    .nav-search input {
      border: none;
      background: none;
      outline: none;
      font-size: 0.8rem;
      font-family: var(--font-sans);
      color: var(--text-primary);
      width: 140px;
    }

    .nav-search input::placeholder { color: var(--text-tertiary); }
    .nav-search .search-icon { font-size: 0.9rem; opacity: 0.5; }

    /* 购物车图标 */
    .nav-cart {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: all var(--duration-base) var(--ease-out-expo);
    }

    .nav-cart:hover { background: var(--light-gray); }
    .nav-cart:active { transform: scale(0.92); }

    .nav-cart .badge {
      position: absolute;
      top: 4px;
      right: 2px;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      background: var(--rose-gold);
      color: var(--white);
      font-size: 0.675rem;
      font-weight: 600;
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      transition: transform 0.25s var(--ease-out-back);
    }

    .nav-cart .badge.bump { transform: scale(1.35); }

    .nav-cart .badge:empty,
    .nav-cart .badge[data-count="0"] {
      display: none;
    }

    /* ========================================
       四、Banner 横滑（修复 scroll-snap）
       ======================================== */
    .banner-section {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: var(--space-xl) var(--space-xl) var(--space-md);
    }

    /* 外层滚动容器 */
    .banner-scroll-wrapper {
      position: relative;
    }

    .banner-scroll {
      display: flex;
      gap: var(--space-md);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding: 0 calc((100% - 84%) / 2);  /* 让首尾卡片也能 snap 到居中 */
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }

    .banner-scroll::-webkit-scrollbar { display: none; }

    .banner-card {
      flex: 0 0 84%;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      height: 360px;
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--duration-base) var(--ease-out-expo);
      box-shadow: var(--shadow-md);
    }

    .banner-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .banner-card:active { transform: scale(0.98); }

    /* Banner 渐变背景 */
    .banner-bg {
      width: 100%;
      height: 100%;
    }

    .banner-bg-1 { background: linear-gradient(160deg, #e8ddd0 0%, #c8b8a5 40%, #b8a088 100%); }
    .banner-bg-2 { background: linear-gradient(160deg, #e2dce8 0%, #c4bdd0 40%, #a898b8 100%); }
    .banner-bg-3 { background: linear-gradient(160deg, #e6dfd5 0%, #d4c8b0 40%, #c4a98a 100%); }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(44, 36, 22, 0.02) 0%,
        rgba(44, 36, 22, 0.18) 50%,
        rgba(44, 36, 22, 0.42) 100%
      );
    }

    .banner-text {
      position: absolute;
      bottom: var(--space-xl);
      left: var(--space-xl);
      right: var(--space-xl);
      color: var(--white);
    }

    .banner-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--rose-gold-light);
      margin-bottom: var(--space-sm);
      padding: 4px 12px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .banner-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: var(--space-xs);
    }

    .banner-sub {
      font-size: 0.9rem;
      font-weight: 300;
      opacity: 0.85;
      line-height: 1.5;
    }

    /* 点状指示器 */
    .banner-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: var(--space-lg);
    }

    .banner-dot {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: var(--text-tertiary);
      border: none;
      cursor: pointer;
      transition: all var(--duration-base) var(--ease-out-expo);
      padding: 0;
    }

    .banner-dot.active {
      width: 28px;
      background: var(--rose-gold);
    }

    /* 左右箭头 */
    .banner-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: all var(--duration-base) var(--ease-out-expo);
      box-shadow: var(--shadow-sm);
    }

    .banner-arrow:hover {
      background: var(--white);
      box-shadow: var(--shadow-md);
      transform: translateY(-50%) scale(1.06);
    }

    .banner-arrow:active { transform: translateY(-50%) scale(0.94); }
    .banner-arrow.prev { left: -12px; }
    .banner-arrow.next { right: -12px; }

    @media (max-width: 768px) {
      .banner-arrow { display: none; }
    }

    /* ========================================
       五、分类标签
       ======================================== */
    .category-section {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: var(--space-md) var(--space-xl);
    }

    .category-row {
      display: flex;
      gap: var(--space-sm);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-row::-webkit-scrollbar { display: none; }

    .category-chip {
      flex-shrink: 0;
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--light-gray);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all var(--duration-base) var(--ease-out-expo);
      white-space: nowrap;
      user-select: none;
    }

    .category-chip:hover {
      color: var(--text-primary);
      background: var(--warm-gray);
    }

    .category-chip.active {
      color: var(--rose-gold-deep);
      background: rgba(var(--rose-gold-rgb), 0.10);
      border-color: rgba(var(--rose-gold-rgb), 0.28);
      font-weight: 600;
    }

    /* ========================================
       六、商品卡片网格（响应式 + 玻璃拟态）
       ======================================== */
    .products-section {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: var(--space-lg) var(--space-xl) var(--space-3xl);
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: var(--space-lg);
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .section-count {
      font-size: 0.8rem;
      color: var(--text-tertiary);
      font-weight: 400;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-lg);
    }

    /* 卡片 — 玻璃拟态 + 细腻阴影 */
    .product-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: all var(--duration-base) var(--ease-out-expo);
      box-shadow: var(--shadow-card);
      /* 滚动揭示初始态 */
      opacity: 0;
      transform: translateY(24px);
    }

    .product-card.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(var(--rose-gold-rgb), 0.22);
    }

    /* 图片区域 */
    .product-card .card-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    /* 真实图片 */
    .product-card .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s var(--ease-out-expo);
    }

    .product-card .card-img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      transition: transform 0.6s var(--ease-out-expo);
    }

    .product-card:hover .card-img-placeholder {
      transform: scale(1.08);
    }

    .card-img-placeholder .bottle-icon {
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.10));
    }

    .card-img-1 { background: linear-gradient(160deg, #f5efe6 0%, #e8d5c0 100%); }
    .card-img-2 { background: linear-gradient(160deg, #f0edf4 0%, #d8d0e8 100%); }
    .card-img-3 { background: linear-gradient(160deg, #f2f0ea 0%, #ddd5c4 100%); }
    .card-img-4 { background: linear-gradient(160deg, #f5f0ec 0%, #e0d4cc 100%); }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--white);
      background: var(--rose-gold);
      pointer-events: none;
    }

    /* 信息区 */
    .card-info {
      padding: var(--space-md);
    }

    .card-brand {
      font-size: 0.65rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--rose-gold);
      margin-bottom: 4px;
    }

    .card-name {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 2px;
      line-height: 1.3;
    }

    .card-note {
      font-size: 0.7rem;
      color: var(--text-tertiary);
      margin-bottom: var(--space-sm);
      line-height: 1.5;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .card-price {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .card-price .currency {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* ========================================
       七、数量选择器（+/- 增减控件）
       ======================================== */
    .qty-control {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: var(--light-gray);
      border-radius: 100px;
      padding: 3px;
    }

    .qty-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: var(--white);
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s var(--ease-out-expo);
      box-shadow: var(--shadow-xs);
      line-height: 1;
    }

    .qty-btn:hover {
      background: var(--rose-gold);
      color: var(--white);
      box-shadow: 0 2px 8px rgba(var(--rose-gold-rgb), 0.35);
    }

    .qty-btn:active {
      transform: scale(0.85);
      transition: all 0.08s ease;
    }

    .qty-btn.dec {
      font-size: 1.2rem;
      line-height: 0.8;
    }

    .qty-value {
      min-width: 28px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      user-select: none;
    }

    /* 加入购物车按钮（初始态：只显示 +） */
    .btn-cart-add {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--rose-gold);
      color: var(--white);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s var(--ease-out-back);
      box-shadow: 0 3px 12px rgba(var(--rose-gold-rgb), 0.32);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      line-height: 1;
    }

    .btn-cart-add:hover {
      background: var(--rose-gold-deep);
      box-shadow: 0 6px 20px rgba(var(--rose-gold-rgb), 0.45);
      transform: scale(1.1);
    }

    .btn-cart-add:active {
      transform: scale(0.82);
      transition: all 0.08s ease;
    }

    /* 涟漪 */
    .btn-cart-add.ripple::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid var(--rose-gold);
      animation: ripple-out 0.55s ease-out forwards;
    }

    @keyframes ripple-out {
      0%   { transform: scale(0.7); opacity: 1; }
      100% { transform: scale(2.0); opacity: 0; }
    }

    /* 成功状态 */
    .btn-cart-add.success-flash {
      background: var(--success);
      box-shadow: 0 3px 12px rgba(127, 176, 105, 0.4);
      pointer-events: none;
    }

    /* ========================================
       八、底部结算栏（全宽固定）
       ======================================== */
    .checkout-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-top: 1px solid var(--glass-border);
      padding: var(--space-md) var(--space-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .checkout-inner {
      max-width: var(--content-max);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .checkout-info {
      display: flex;
      flex-direction: column;
    }

    .checkout-count {
      font-size: 0.725rem;
      color: var(--text-tertiary);
      margin-bottom: 2px;
    }

    .checkout-total {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .checkout-total .currency {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .btn-checkout {
      padding: 14px 40px;
      border-radius: 100px;
      border: none;
      background: var(--text-primary);
      color: var(--white);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: var(--font-sans);
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all var(--duration-base) var(--ease-out-expo);
      white-space: nowrap;
      min-width: 120px;
    }

    .btn-checkout:hover:not(:disabled) {
      background: #3D3428;
      transform: scale(1.04);
    }

    .btn-checkout:active:not(:disabled) {
      transform: scale(0.95);
    }

    .btn-checkout:disabled {

    /* ========================================

    /* Banner 管理列表项 */

    .admin-panel-footer {

      flex-wrap: wrap;
    }

    /* ========================================
       十三、编辑弹窗
       ======================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(44, 36, 22, 0.4);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;

      pointer-events: none;

    .modal-card {

    .modal-actions {

      padding: 8px 18px;

      font-family: var(--font-sans);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out-expo);

    .btn-sm:hover { background: var(--light-gray); }

    .btn-sm.danger { color: #d32f2f; }
    .btn-sm.danger:hover { background: #fde8e8; border-color: #fde8e8; }

    @media (max-width: 640px) {

      /* 导航栏 */

      /* Banner */

  <script>
    /* ========================================
       密码门控 — 管理者登录验证
       ======================================== */
    (function() {
      var CORRECT_PASSWORD = 'admin888';

      var $loginOverlay = document.getElementById('loginOverlay');
      var $loginPassword = document.getElementById('loginPassword');
      var $loginError = document.getElementById('loginError');
      var $btnLogin = document.getElementById('btnLogin');

      if (sessionStorage.getItem('lgwc_admin_auth') === 'true') {
        $loginOverlay.classList.add('hidden');
      }

      function doLogin() {
        var pwd = $loginPassword.value.trim();
        if (!pwd) {
          $loginError.textContent = '请输入管理密码';
          return;
        }
        if (pwd === CORRECT_PASSWORD) {
          sessionStorage.setItem('lgwc_admin_auth', 'true');
          $loginOverlay.classList.add('hidden');
          $loginError.textContent = '';
          showToast('欢迎进入管理后台');
        } else {
          $loginError.textContent = '密码错误，请重试';
          $loginPassword.value = '';
          $loginPassword.focus();
          $loginOverlay.style.animation = 'none';
          $loginOverlay.offsetHeight;
          $loginOverlay.style.animation = 'loginShake 0.4s ease';
        }
      }

      $btnLogin.addEventListener('click', doLogin);
      $loginPassword.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
      });

      window._adminLogout = function() {
        if (confirm('确定退出管理后台吗？')) {
          sessionStorage.removeItem('lgwc_admin_auth');
          $loginOverlay.classList.remove('hidden');
          $loginPassword.value = '';
          $loginError.textContent = '';
          closeAdminPanel();
          showToast('已退出管理后台');
        }
      };

      window.setAdminPassword = function(newPassword) {
        if (!newPassword || newPassword.length < 6) {
          console.error('密码至少 6 位');
          return;
        }
        console.log('新密码（请更新 CORRECT_PASSWORD 变量）: ' + newPassword);
        alert('请在代码中修改 CORRECT_PASSWORD 为: ' + newPassword);
      };
    })();

    var loginShakeStyle = document.createElement('style');
    loginShakeStyle.textContent = '@keyframes loginShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-6px)}}';
    document.head.appendChild(loginShakeStyle);

    /* ========================================
       管理面板 — 数据持久化常量
       ======================================== */
    const STORAGE_KEY = 'zhijian_products';
    const CAT_STORAGE_KEY    = 'zhijian_categories';
    const BANNER_STORAGE_KEY = 'zhijian_banners';
    const DEFAULT_PRODUCTS   = JSON.parse(JSON.stringify(products));
    const DEFAULT_CATEGORIES = JSON.parse(JSON.stringify(categories));
    const DEFAULT_BANNERS    = JSON.parse(JSON.stringify(banners));


    /* ========================================
       数据层 — 商品列表
       ======================================== */
    // 分类数据（key 用于数据关联，label 用于显示）
    // Banner 数据（可编辑）
    const banners = [
      { tag: 'New Arrival', title: '四季书签·春',     sub: '铜镀玫瑰金 · 樱花镂空 · 流苏书签', bg: 'banner-bg-1' },
      { tag: 'Best Seller', title: '故宫雪景冰箱贴',   sub: '太和殿雪景 · 亚克力浮雕 · 磁吸',   bg: 'banner-bg-2' },
      { tag: 'Hot Pick',    title: '马卡龙色系笔记本', sub: 'A5/B6双尺寸 · 道林纸 · 软硬壳可选', bg: 'banner-bg-3' }
    ];

    const categories = [
      { key: 'bookmark',  label: '四季书签' },
      { key: 'magnet',    label: '冰箱贴' },
      { key: 'notebook',  label: '马卡龙色系笔记本' }
    ];

    const products = [
      { id: 1, brand: '理工', name: '春樱书签',   note: '樱花浮雕 · 铜镀玫瑰金 · 流苏坠',   price: 38,  category: 'bookmark',  badge: '新品',     gradient: 'card-img-1', emoji: '🌸', image: '' },
      { id: 2, brand: '理工', name: '夏荷书签',   note: '荷叶镂空 · 黄铜做旧 · 绿松石缀',   price: 42,  category: 'bookmark',  badge: '',         gradient: 'card-img-2', emoji: '🍃', image: '' },
      { id: 3, brand: '理工', name: '故宫雪景',   note: '太和殿雪景 · 亚克力浮雕 · 磁吸',   price: 28,  category: 'magnet',    badge: '热卖',     gradient: 'card-img-3', emoji: '🏯', image: '' },
      { id: 4, brand: '理工', name: '猫咪系列',   note: '六只姿态各异的猫 · 软磁 · 礼盒装', price: 55,  category: 'magnet',    badge: '',         gradient: 'card-img-4', emoji: '🐱', image: '' },
      { id: 5, brand: '理工', name: '马卡龙·樱花粉', note: 'A5软面 · 80g道林纸 · 192页',     price: 68,  category: 'notebook',  badge: '爆款',     gradient: 'card-img-1', emoji: '📒', image: '' },
      { id: 6, brand: '理工', name: '马卡龙·薄荷绿', note: 'B6硬壳 · 100g象牙纸 · 256页',    price: 79,  category: 'notebook',  badge: '',         gradient: 'card-img-2', emoji: '📘', image: '' }
    ];

    /* ========================================
       状态层
       ======================================== */
    let cart = [];              // { id, qty }
    let activeCategory = 'all';

    /* ========================================
       DOM 引用
       ======================================== */
    const $productsGrid   = document.getElementById('productsGrid');
    const $productCount   = document.getElementById('productCount');
    const $checkoutCount  = document.getElementById('checkoutCount');
    const $checkoutTotal  = document.getElementById('checkoutTotal');
    const $btnCheckout    = document.getElementById('btnCheckout');
    const $cartBadge      = document.getElementById('cartBadge');
    const $bannerScroll        = document.getElementById('bannerScroll');
    const $bannerDotsContainer = document.getElementById('bannerDots');
    const $bannerPrev          = document.getElementById('bannerPrev');
    const $bannerNext          = document.getElementById('bannerNext');
    const $toast          = document.getElementById('toast');
    const $categoryRow    = document.getElementById('categoryRow');
    const $navCartBtn     = document.getElementById('navCartBtn');
    const $cartOverlay    = document.getElementById('cartOverlay');
    const $cartDrawer     = document.getElementById('cartDrawer');
    const $cartDrawerBody = document.getElementById('cartDrawerBody');
    const $cartDrawerClose = document.getElementById('cartDrawerClose');
    const $cartDrawerCheckout = document.getElementById('cartDrawerCheckout');

    /* ========================================
       工具函数
       ======================================== */
    function getCartItem(id)   { return cart.find(c => c.id === id); }
    function getProduct(id)    { return products.find(p => p.id === id); }
    function totalItems()      { return cart.reduce((s, i) => s + i.qty, 0); }
    function totalPrice()      { return cart.reduce((s, i) => { const p = getProduct(i.id); return s + (p ? p.price * i.qty : 0); }, 0); }

    /* ========================================
       渲染层 — 商品卡片
       ======================================== */
    function renderProducts(filter = 'all') {
      const filtered = filter === 'all'
        ? products
        : products.filter(p => p.category === filter);

      $productCount.textContent = `共 ${filtered.length} 件`;

      $productsGrid.innerHTML = filtered.map(p => {
        const cartItem = getCartItem(p.id);
        const qty = cartItem ? cartItem.qty : 0;

        // 右侧控件：未加入显示 + 按钮，已加入显示数量调节器
        let actionHTML;
        if (qty > 0) {
          actionHTML = `
            <div class="qty-control">
              <button class="qty-btn dec" data-id="${p.id}" aria-label="减少数量">−</button>
              <span class="qty-value">${qty}</span>
              <button class="qty-btn inc" data-id="${p.id}" aria-label="增加数量">+</button>
            </div>`;
        } else {
          actionHTML = `<button class="btn-cart-add" data-id="${p.id}" aria-label="加入购物车">+</button>`;
        }

        // 图片区域：有真实图片用 <img>，否则用渐变+emoji 占位
        const imgHTML = p.image
          ? `<img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
          : '';
        const placeholderHTML = p.image
          ? `<div class="card-img-placeholder" style="display:none;"><span class="bottle-icon">${p.emoji}</span></div>`
          : `<div class="card-img-placeholder"><span class="bottle-icon">${p.emoji}</span></div>`;

        return `
          <div class="product-card" data-id="${p.id}">
            <div class="card-img ${p.gradient}">
              ${imgHTML}
              ${placeholderHTML}
              ${p.badge ? `<span class="card-badge">${p.badge}</span>` : ''}
            </div>
            <div class="card-info">
              <div class="card-brand">${p.brand}</div>
              <div class="card-name">${p.name}</div>
              <div class="card-note">${p.note}</div>
              <div class="card-bottom">
                <span class="card-price">
                  <span class="currency">¥</span>${p.price}
                </span>
                ${actionHTML}
              </div>
            </div>
          </div>`;
      }).join('');

      // 绑定事件
      bindCartEvents();
      // 滚动揭示
      initReveal();
    }

    /* ========================================
       事件绑定 — 购物车按钮
       ======================================== */
    function bindCartEvents() {
      // "加入购物车"按钮（初始 +）
      document.querySelectorAll('.btn-cart-add').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          addToCart(id, btn);
        });
      });

      // 增加按钮（qty-control 内的 +）
      document.querySelectorAll('.qty-btn.inc').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          incrementCart(id);
        });
      });

      // 减少按钮（qty-control 内的 −）
      document.querySelectorAll('.qty-btn.dec').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          decrementCart(id);
        });
      });
    }

    /* ========================================
       购物车操作
       ======================================== */
    function addToCart(id, btnElement) {
      const existing = getCartItem(id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id, qty: 1 });
      }

      // 按钮动画
      if (btnElement) {
        btnElement.classList.add('ripple');
        btnElement.classList.add('success-flash');
        btnElement.textContent = '✓';
        setTimeout(() => {
          btnElement.classList.remove('ripple');
          btnElement.classList.remove('success-flash');
        }, 600);
      }

      // 重新渲染（显示数量选择器）
      renderProducts(activeCategory);
      updateCheckoutBar();
      updateCartBadge();
      const product = getProduct(id);
      showToast(`已添加「${product.name}」`);
    }

    function incrementCart(id) {
      const item = getCartItem(id);
      if (!item) return;
      item.qty += 1;
      renderProducts(activeCategory);
      updateCheckoutBar();
      updateCartBadge();
    }

    function decrementCart(id) {
      const item = getCartItem(id);
      if (!item) return;
      item.qty -= 1;
      if (item.qty <= 0) {
        cart = cart.filter(c => c.id !== id);
        const product = getProduct(id);
        showToast(`已移除「${product.name}」`);
      }
      renderProducts(activeCategory);
      updateCheckoutBar();
      updateCartBadge();
    }

    /* ========================================
       结算栏更新
       ======================================== */
    function updateCheckoutBar() {
      const count = totalItems();
      const price = totalPrice();

      if (count === 0) {
        $checkoutCount.textContent = '暂未选择商品';
        $checkoutTotal.textContent = '0';
        $btnCheckout.disabled = true;
      } else {
        $checkoutCount.textContent = `共 ${count} 件商品`;
        $checkoutTotal.textContent = price.toLocaleString();
        $btnCheckout.disabled = false;
      }
    }

    function updateCartBadge() {
      const count = totalItems();
      $cartBadge.textContent = count;
      $cartBadge.setAttribute('data-count', count);
      // 徽标弹跳动画
      $cartBadge.classList.add('bump');
      setTimeout(() => $cartBadge.classList.remove('bump'), 300);
    }

    /* ========================================
       Toast
       ======================================== */
    let toastTimer;
    function showToast(msg) {
      clearTimeout(toastTimer);
      $toast.textContent = msg;
      $toast.classList.add('show');
      toastTimer = setTimeout(() => $toast.classList.remove('show'), 1800);
    }

    /* ========================================
       购物车抽屉
       ======================================== */
    function openCartDrawer() {
      renderCartDrawer();
      $cartOverlay.classList.add('open');
      $cartDrawer.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeCartDrawer() {
      $cartOverlay.classList.remove('open');
      $cartDrawer.classList.remove('open');
      document.body.style.overflow = '';

    function renderCartDrawer() {

    /* ========================================

       ======================================== */
    function getBannerCardWidth() {
      const card = $bannerScroll.querySelector('.banner-card');
      if (!card) return 0;
      const cardW = card.offsetWidth;
      const gap = parseInt(getComputedStyle($bannerScroll).gap) || 16;
      return cardW + gap;
    }

    function getBannerIndex() {
      const step = getBannerCardWidth();
      if (step === 0) return 0;
      return Math.round($bannerScroll.scrollLeft / step);
    }

    function getBannerDots() { return document.querySelectorAll('#bannerDots .banner-dot'); }

    function updateBannerDots() {
      const idx = getBannerIndex();
      getBannerDots().forEach((dot, i) => dot.classList.toggle('active', i === idx));
    }

    function scrollToBanner(index) {
      const step = getBannerCardWidth();
      $bannerScroll.scrollTo({ left: step * index, behavior: 'smooth' });
    }

    // 滚动监听
    $bannerScroll.addEventListener('scroll', updateBannerDots, { passive: true });

    // 指示器点击
    $bannerDotsContainer.addEventListener('click', (e) => {
      const dot = e.target.closest('.banner-dot');
      if (!dot) return;
      scrollToBanner(parseInt(dot.dataset.index));
    });

    // 左右箭头
    $bannerPrev.addEventListener('click', () => {
      const idx = getBannerIndex();
      scrollToBanner(Math.max(0, idx - 1));
    });

    $bannerNext.addEventListener('click', () => {
      const idx = getBannerIndex();
      const dots = getBannerDots();
      scrollToBanner(Math.min(dots.length - 1, idx + 1));
    });

    let resizeDebounce;
    window.addEventListener('resize', () => {
      clearTimeout(resizeDebounce);
      resizeDebounce = setTimeout(updateBannerDots, 100);
    });

    // 键盘左右键支持
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft')  { e.preventDefault(); const idx = getBannerIndex(); scrollToBanner(Math.max(0, idx - 1)); }
      if (e.key === 'ArrowRight') { e.preventDefault(); const idx = getBannerIndex(); const dots = getBannerDots(); scrollToBanner(Math.min(dots.length - 1, idx + 1)); }
    });

    /* ========================================
       滚动揭示（IntersectionObserver）
       ======================================== */
    function initReveal() {
      const cards = document.querySelectorAll('.product-card:not(.revealed)');
      if (cards.length === 0) return;

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
          if (entry.isIntersecting) {
            // 逐张卡片延时出现
            const delay = Array.from(cards).indexOf(entry.target) % 6;
            setTimeout(() => {
              entry.target.classList.add('revealed');
            }, delay * 60);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });

      cards.forEach(card => observer.observe(card));
    }

      const file = $editImageFile.files[0];
      if (!file) return;
      // 检查大小（localStorage 限制约 5MB，base64 膨胀约 1.33x，限制文件 3MB）
      if (file.size > 3 * 1024 * 1024) {
        showToast('图片太大，请使用 3MB 以下的文件');
        $editImageFile.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        tempImageData = reader.result;
        updateImagePreview(tempImageData);
      };
      reader.readAsDataURL(file);
    });

    // 清除图片
    $editImageClear.addEventListener('click', () => {
      tempImageData = '';
      $editImageFile.value = '';
      updateImagePreview('');
    });

    // --- 编辑弹窗 ---
    function openEditModal(id) {
      editingId = id;
      tempImageData = '';
      $editImageFile.value = '';
      if (id !== null) {
        const p = getProduct(id);
        if (!p) return;
        $editModalTitle.textContent = '编辑商品';
        $editId.value = p.id;
        $editName.value = p.name;
        $editBrand.value = p.brand;
        $editNote.value = p.note;
        $editPrice.value = p.price;
        renderCategorySelect(p.category);
        $editBadge.value = p.badge || '';
        $editGradient.value = p.gradient;
        $editEmoji.value = p.emoji || '';
        tempImageData = p.image || '';
        updateImagePreview(tempImageData);
        $editDeleteBtn.style.display = '';
      } else {
        $editModalTitle.textContent = '添加商品';
        $editForm.reset();
        renderCategorySelect(categories.length > 0 ? categories[0].key : '');
        $editId.value = '';
        $editBrand.value = 'ESSENCE';
        $editCategory.value = 'floral';
        $editGradient.value = 'card-img-1';
        $editPrice.value = '';
        $editDeleteBtn.style.display = 'none';
      }
      $editModalOverlay.classList.add('open');
    }

    function closeEditModal() {
      $editModalOverlay.classList.remove('open');
      editingId = null;
    }

    $editModalOverlay.addEventListener('click', (e) => {
      if (e.target === $editModalOverlay) closeEditModal();
    });
    $editCancelBtn.addEventListener('click', closeEditModal);

    // --- 保存商品 ---
    $editForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const name = $editName.value.trim();
      const price = parseInt($editPrice.value);
      if (!name || isNaN(price) || price < 0) {
        showToast('请填写商品名称和有效价格');
        return;
      }

      const data = {
        name,
        brand: $editBrand.value.trim() || 'ESSENCE',
        note: $editNote.value.trim(),
        price,
        category: $editCategory.value,
        badge: $editBadge.value.trim(),
        gradient: $editGradient.value,
        emoji: $editEmoji.value.trim() || '📦',
        image: tempImageData,  // base64 图片数据
      };

      if (editingId !== null) {
        // 编辑模式
        const p = getProduct(editingId);
        if (p) Object.assign(p, data);
      } else {
        // 新增模式
        const maxId = products.reduce((max, p) => Math.max(max, p.id), 0);
        products.push({ id: maxId + 1, ...data });
      }

      saveProducts();
      closeEditModal();
      renderAdminList();
      renderProducts(activeCategory);
      updateCheckoutBar();
      updateCartBadge();
      showToast(editingId !== null ? `已更新「${name}」` : `已添加「${name}」`);
    });

    // --- 删除（弹窗内） ---
    $editDeleteBtn.addEventListener('click', () => {
      if (editingId === null) return;
      const p = getProduct(editingId);
      if (!p) return;
      if (!confirm(`确定删除「${p.name}」吗？`)) return;
      const idx = products.findIndex(pr => pr.id === editingId);
      if (idx > -1) products.splice(idx, 1);
      cart = cart.filter(c => c.id !== editingId);
      saveProducts();
      closeEditModal();
      renderAdminList();
      renderProducts(activeCategory);
      updateCheckoutBar();
      updateCartBadge();
      showToast(`已删除「${p.name}」`);
    });

    // --- 重置 ---
    $adminResetBtn.addEventListener('click', () => {
      if (confirm('确定恢复为默认商品数据吗？当前修改将丢失，购物车也将清空。')) {
        resetToDefault();
        renderAdminList();
      }
    });

    // --- 导出 JSON ---
    $adminExportBtn.addEventListener('click', () => {
      const data = { banners, categories, products };
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'zhijian_backup.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('已导出商品+分类数据 JSON');
    });

    // --- 导入 JSON ---
    $adminImportBtn.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.addEventListener('change', () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            // 兼容旧格式（纯数组）和新格式（{banners, categories, products}）
            let prods, cats, bans;
            if (Array.isArray(data)) {
              prods = data; cats = null; bans = null;
            } else if (data.products && Array.isArray(data.products)) {
              prods = data.products; cats = data.categories || null; bans = data.banners || null;
            } else {
              throw new Error('数据格式错误：需要商品数组或 {banners, categories, products} 对象');
            }
            if (prods.length === 0) throw new Error('商品数据为空');
            if (!prods[0].name || !prods[0].price) throw new Error('缺少必需字段 name/price');

            const parts = [`${prods.length} 件商品`];
            if (cats) parts.push(`${cats.length} 个分类`);
            if (bans) parts.push(`${bans.length} 张 Banner`);
            const msg = `即将导入 ${parts.join(' + ')}，会覆盖当前数据。确认？`;
            if (!confirm(msg)) return;

            products.length = 0;
            prods.forEach(p => products.push(p));
            if (cats) {
              categories.length = 0;
              cats.forEach(c => categories.push(c));
              saveCategories();
              renderCategories();
              renderAdminCatList();
            }
            if (bans) {
              banners.length = 0;
              bans.forEach(b => banners.push(b));
              saveBanners();
              renderBanners();
              renderAdminBannerList();
            }
            saveProducts();
            renderAdminList();
            renderProducts(activeCategory);
            updateCheckoutBar();
            updateCartBadge();
            showToast(`成功导入 ${parts.join(' + ')}`);
          } catch (err) {
            showToast('导入失败：' + err.message);
          }
        };
        reader.readAsText(file);
      });
      input.click();
    });

    // --- 键盘快捷键：Ctrl+E 打开管理面板 ---
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'e') {
        e.preventDefault();
        if ($adminPanel.classList.contains('open')) {
          closeAdminPanel();
        } else {
          openAdminPanel();
        }
      }
    });

    // --- 初始化：从 localStorage 加载 ---
    function initProducts() {
      const saved = loadProducts();
      products.length = 0;
      saved.forEach(p => products.push(p));
    }
    function initCategories() {
      const saved = loadCategories();
      categories.length = 0;
      saved.forEach(c => categories.push(c));
    }

    // === 最终启动（所有声明完成后才执行） ===
    init();
  </script>

</body>
</html>
